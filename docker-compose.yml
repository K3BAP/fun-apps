services:
  # Sammelprojekt fun-apps – React-PWA mit schlankem Express-Backend.
  # Ein Container: Express liefert den Client-Build aus (mit passenden
  # Cache-Headern) und beherbergt /api. Reverse-Proxy + TLS übernimmt Caddy
  # (Block fun.sponholz.org). Kein Portexport.
  #
  # Anders als früher gibt es einen Build-Step – Änderungen brauchen
  # `docker compose up -d --build`, ein Neustart allein genügt nicht mehr.
  fun-apps-web:
    build: .
    image: fun-apps:latest
    container_name: fun-apps-web
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
