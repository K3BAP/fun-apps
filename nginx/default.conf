# fun-apps – statische Auslieferung von /site
#
# Wichtig: Das Projekt hat keinen Build-Step, also auch keine gehashten Dateinamen
# (app.js bleibt immer app.js). Ohne Cache-Control raten Browser die Haltbarkeit
# heuristisch aus Last-Modified (Faustregel ~10 % des Dateialters) und liefern
# dann stunden- bis tagelang alte Stände aus – genau der Effekt, den Brave/Chrome
# auf Android zeigen. Mit "no-cache" darf der Browser weiter cachen, muss den
# Stand aber bei jedem Aufruf revalidieren: nginx antwortet per ETag meist mit
# einem 304 (0 Byte Body), der Reload bleibt also günstig und ist immer aktuell.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
