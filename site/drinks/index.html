<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1c1a17" />
  <meta name="description" content="Kellner-Bestellsystem – Getränkekarte Bitburger Wirtshaus Trier" />
  <title>Drinks · Bitburger Wirtshaus Trier</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍺</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Kopfbereich -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-dot">🍺</span>
        <div>
          <div class="brand-title">Wirtshaus Trier</div>
          <div class="brand-sub">Kellner · Bestellung</div>
        </div>
      </div>
      <button id="tableBtn" class="table-btn" aria-label="Tisch wählen">
        <span class="table-btn-label">Tisch</span>
        <span id="tableNum" class="table-btn-num">1</span>
      </button>
    </div>

    <div class="search-row">
      <span class="search-ico" aria-hidden="true">🔎</span>
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="Getränk oder Zutat suchen …" aria-label="Getränk suchen" />
      <button id="clearSearch" class="clear-search" aria-label="Suche löschen" hidden>✕</button>
    </div>

    <div class="chip-row" id="chips" role="tablist" aria-label="Kategorien"></div>

    <label class="hh-toggle">
      <input type="checkbox" id="hhToggle" />
      <span class="hh-track"><span class="hh-thumb"></span></span>
      <span class="hh-text">Happy Hour <small>bis 22 Uhr – Cocktails halber Preis</small></span>
    </label>
  </header>

  <!-- Liste -->
  <main id="list" class="list" aria-live="polite"></main>

  <!-- Untere Bestell-Leiste -->
  <button id="orderBar" class="order-bar" hidden aria-label="Bestellung öffnen">
    <span class="ob-left">
      <span class="ob-count" id="obCount">0</span>
      <span class="ob-text">Tisch <b id="obTable">1</b> · Bestellung</span>
    </span>
    <span class="ob-total" id="obTotal">0,00 €</span>
  </button>

  <!-- Overlay + Sheets -->
  <div id="scrim" class="scrim" hidden></div>

  <!-- Warenkorb-Sheet -->
  <section id="cartSheet" class="sheet" hidden aria-label="Bestellung">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>Bestellung · Tisch <span id="cartTable">1</span></h2>
      <button class="sheet-close" data-close aria-label="Schließen">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span>Gesamt</span>
        <span id="cartTotal">0,00 €</span>
      </div>
      <div class="cart-actions">
        <button id="clearCart" class="btn btn-ghost">Leeren</button>
        <button id="sendOrder" class="btn btn-primary">Bestellung absenden</button>
      </div>
    </div>
  </section>

  <!-- Varianten-Chooser-Sheet -->
  <section id="variantSheet" class="sheet sheet-sm" hidden aria-label="Größe wählen">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="variantName">Größe wählen</h2>
      <button class="sheet-close" data-close aria-label="Schließen">✕</button>
    </div>
    <div id="variantList" class="variant-list"></div>
  </section>

  <!-- Tisch-Auswahl-Sheet -->
  <section id="tableSheet" class="sheet sheet-sm" hidden aria-label="Tisch wählen">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>Tisch wählen</h2>
      <button class="sheet-close" data-close aria-label="Schließen">✕</button>
    </div>
    <div id="tableGrid" class="table-grid"></div>
  </section>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
